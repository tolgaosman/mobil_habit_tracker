name: mobil_habit_tracker
description: A modern, minimalist dark-themed habit tracker mobile application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.6

  # Local storage / persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Local notifications
  flutter_local_notifications: ^14.1.5
  timezone: ^0.9.2

  # Utilities
  uuid: ^3.0.7
  intl: ^0.18.1
  flutter_animate: ^4.2.0
  provider: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
