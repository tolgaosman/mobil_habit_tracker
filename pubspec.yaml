name: mobil_habit_tracker
description: A modern, minimalist dark-themed habit tracker mobile application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.6

  # Local storage / persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Android home-screen widgets
  home_widget: ^0.7.0

  # Local notifications
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

  # Utilities
  uuid: ^4.5.3
  intl: ^0.20.2
  flutter_animate: ^4.2.0
  provider: ^6.0.5
  google_fonts: ^6.2.0
  http: ^1.2.0

  # Auth & Profile
  image_picker: ^1.1.2
  crypto: ^3.0.3
  image_cropper: ^12.2.1
  bcrypt: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Required to regenerate habit_model.g.dart if model changes
  hive_generator: ^2.0.1
  build_runner: ^2.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/squareLogo.png"
  adaptive_icon_background: "#4C9C5B"
  adaptive_icon_foreground: "assets/images/squareLogo.png"
  adaptive_icon_foreground_inset: 16

flutter_native_splash:
  color: "#3E8E4F"
  image: "assets/images/circleLogo.png"
  fullscreen: true
  android: true
  ios: false
  android_12:
    color: "#3E8E4F"
    image: "assets/images/circleLogo.png"
    icon_background_color: "#3E8E4F"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
